# CI for the Diablo16-Serial-Arduino-Library.
#
# Compiles the library standalone against each bundled example sketch using
# `pio ci`, pinned to platform atmelavr / board megaatmega2560. This proves the
# library builds on its own.

stages:
  - build

variables:
  # Target board for the standalone build.
  PIO_BOARD: megaatmega2560
  # Keep PlatformIO's downloaded toolchain/packages inside the project so GitLab
  # CI caching can persist them between runs.
  PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.platformio"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PLATFORMIO_BUILD_FLAGS: "-Wall -Werror"

default:
  image: python:3.12
  cache:
    key: "pio-$PIO_BOARD"
    paths:
      - .platformio/
      - .pip-cache/
  before_script:
    - pip install --quiet --upgrade platformio
    - pio --version

.compile:
  stage: build
  script:
    # `pio ci` treats this repo as the library under test (--lib=".") and
    # compiles the example sketch against it on the pinned board.
    - pio ci "$EXAMPLE_DIR" --lib="." --board="$PIO_BOARD"

compile:BigDemo:
  extends: .compile
  variables:
    EXAMPLE_DIR: examples/BigDemo

compile:Display_print:
  extends: .compile
  variables:
    EXAMPLE_DIR: examples/Display_print
