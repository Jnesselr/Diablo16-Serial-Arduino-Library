# CI for the Diablo16-Serial-Arduino-Library.
#
# Compiles the library standalone against each bundled example sketch using
# `pio ci`, pinned to platform atmelavr / board megaatmega2560. This proves the
# library builds on its own.

name: build

on:
  push:
  pull_request:

env:
  # Target board for the standalone build.
  PIO_BOARD: megaatmega2560
  PLATFORMIO_BUILD_FLAGS: "-Wall -Werror"

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/BigDemo
          - examples/Display_print
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Cache PlatformIO's downloaded AVR toolchain/packages between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.PIO_BOARD }}
      - name: Install PlatformIO
        run: |
          pip install --quiet --upgrade platformio
          pio --version
      - name: Compile ${{ matrix.example }}
        # `pio ci` treats this repo as the library under test (--lib=".") and
        # compiles the example sketch against it on the pinned board.
        run: pio ci "${{ matrix.example }}" --lib="." --board="$PIO_BOARD"
